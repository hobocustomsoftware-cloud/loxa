worker_processes auto;
events { worker_connections 1024; }
http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout  65;

  # HLS / m3u8 / ts types (for later video)
  types {
    application/vnd.apple.mpegurl m3u8;
    video/mp2t ts;
    video/mp4 mp4;
    application/pdf pdf;
  }

  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

  # HTTP server (handles requests from Cloudflare)
  server {
    client_max_body_size 200m;
    proxy_read_timeout 75s;
    listen 80;
    server_name _;

    # Trust Cloudflare forwarded protocol
    set_real_ip_from 0.0.0.0/0; # trust all IPs (or restrict to Cloudflare IPs)
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Use real client IP for logging
    log_format cloudflare '$http_x_forwarded_for - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';

    # Security headers (keeping important ones)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Health check
    location /health/ { 
      return 200; 
    }

    # Proxy to Django
    location / {
      proxy_pass         http://web:8000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;  # Use Cloudflare header
      proxy_set_header   X-Forwarded-Host $host;
      proxy_set_header   X-Forwarded-Port $server_port;
    }

    # API endpoints with rate limiting
    location /api/ {
      limit_req zone=api burst=20;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;  # Use Cloudflare header
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_pass http://web:8000;
    }

    # Internal protected media — Django sets X-Accel-Redirect to this path
    location /_internal_media/ {
      internal;
      alias /data/media/;
      add_header Accept-Ranges bytes;
    }

    # Public static files
    location /static/ {
      alias /data/static/;
      autoindex off;
      access_log off;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Public media files
    location /media/ {
      alias /data/media/;
      autoindex off;
      expires 30d;
      add_header Cache-Control "public";
    }
  }
}
