worker_processes auto;
events { worker_connections 1024; }
http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout  65;

  # HLS / m3u8 / ts types (for later video)
  types {
    application/vnd.apple.mpegurl m3u8;
    video/mp2t ts;
    video/mp4 mp4;
    application/pdf pdf;
  }

  server {
    listen 80;
    server_name _;

    # Proxy to Django
    location / {
      proxy_pass         http://web:8000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Internal protected media — Django sets X-Accel-Redirect to this path
    location /_internal_media/ {
      internal;
      alias /data/media/;
      # allow range requests for videos
      add_header Accept-Ranges bytes;
    }

    # Public static (whitenoise serves too, but nginx is faster)
    location /static/ {
      alias /data/static/;
      access_log off;
      expires 30d;
    }

    # Media (public)
    location /media/ {
        alias /data/media/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
    }
  }
}
