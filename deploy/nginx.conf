worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout  65;

  # HLS / m3u8 / ts types (for later video)
  types {
    application/vnd.apple.mpegurl m3u8;
    video/mp2t ts;
    video/mp4 mp4;
    application/pdf pdf;
  }

  server {
    listen 80;
    server_name _;

    # Trust Cloudflare forwarded protocol
    # Cloudflare IP ranges (updated from https://www.cloudflare.com/ips/)
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Proxy to Django
    location / {
      proxy_pass         http://web:8000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;  # Use Cloudflare header
      proxy_set_header   X-Forwarded-Host $host;
      proxy_set_header   X-Forwarded-Port $server_port;
    }

    # Internal protected media — Django sets X-Accel-Redirect to this path
    location /_internal_media/ {
      internal;
      alias /data/media/;
      add_header Accept-Ranges bytes;
    }

    # Public static (nginx faster than Django)
    location /static/ {
      alias /data/static/;
      autoindex off;
      access_log off;
      expires 1y;
    }

    # Media (public)
    location /media/ {
      alias /data/media/;
      autoindex off;
    }
  }
}
