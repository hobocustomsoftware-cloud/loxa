# version: "3.9"

x-app-env: &app_env
  DJANGO_SETTINGS_MODULE: loxa.settings
  DJANGO_DEBUG: "1"
  DEBUG: "1"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  # DB (connect through postgres directly for Phase 1)
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  # static/media
  STATIC_ROOT: /data/static
  MEDIA_ROOT: /data/media

services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: loxa/web:latest
    env_file: [.env]
    environment: *app_env
    # command: ["/app/deploy/entrypoint.web.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"     # http://localhost:8000
    volumes:
      - loxa_static:/data/static
      - loxa_media:/data/media
      - .:/app
    command: python manage.py runserver 0.0.0.0:8000
    # healthcheck:
    #   test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz/"]
    #   interval: 15s
    #   timeout: 5s
    #   retries: 5
    # Dev laptop friendly limits (optional)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
  nginx:
      image: nginx:1.27
      depends_on:
        - web
      ports:
        - "80:80"
      volumes:
        - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
        - loxa_media:/data/media:ro
        - loxa_static:/data/static:ro
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  app_static:
  app_media:
  loxa_media:
  loxa_static:
